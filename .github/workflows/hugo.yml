# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.148.2
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Notify IndexNow partner engines (Bing, Yandex, Naver, Seznam, ...) about
  # new/changed content after each deployment.
  # Key file (public by protocol design): https://ozkanpakdil.github.io/1c26fb725c84515f7f275b0e8c1c3f6e.txt
  indexnow:
    needs: deploy
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Submit new and changed URLs
        run: |
          set -euo pipefail
          BASE="https://ozkanpakdil.github.io"
          HOST="ozkanpakdil.github.io"
          KEY="$(cat static/1c26fb725c84515f7f275b0e8c1c3f6e.txt)"

          url_for() {
            local path="$1"
            path="${path#content/}"
            path="${path%.md}"
            case "$path" in
              index|*/index)    path="${path%/index}" ;;
              _index|*/_index)  path="${path%/_index}" ;;
            esac
            [ -z "$path" ] && { printf '%s/' "$BASE"; return; }
            printf '%s/%s/' "$BASE" "${path#/}"
          }

          BEFORE="${{ github.event.before }}"
          if [[ "$BEFORE" =~ ^0+$ || -z "$BEFORE" ]]; then
            CHANGED=""
          else
            CHANGED="$(git diff --name-only --diff-filter=ACMRT "$BEFORE" HEAD -- content/ || true)"
          fi

          if [[ -z "$CHANGED" ]]; then
            echo "No content/ changes in this push; skipping IndexNow submission."
            exit 0
          fi

          # Homepage always reflects new posts; changed pages verified against
          # the live site (the Pages deploy has just finished, small CDN lag
          # possible) so we never submit dead URLs.
          URLS="[\"$BASE/\"]"
          while IFS= read -r f; do
            case "$f" in
              *.md) ;;
              *) continue ;;
            esac
            candidate="$(url_for "$f")"
            code="000"
            for i in 1 2 3; do
              code="$(curl -s -o /dev/null -w '%{http_code}' "$candidate")"
              [ "$code" = "200" ] && break
              sleep 20
            done
            if [ "$code" = "200" ]; then
              URLS="$URLS,\"$candidate\""
              echo "verified: $candidate"
            else
              echo "skipping (HTTP $code): $candidate"
            fi
          done <<< "$CHANGED"

          echo "Submitting to IndexNow: $URLS"
          RESP="$(curl -s -o /tmp/indexnow-response.txt -w '%{http_code}' -X POST \
            'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"$HOST\",\"key\":\"$KEY\",\"urlList\":$URLS}")"
          echo "IndexNow response: HTTP $RESP $(cat /tmp/indexnow-response.txt 2>/dev/null || true)"
          case "$RESP" in
            200|202) echo "OK: URLs accepted by IndexNow." ;;
            403)     echo "Warning: key file not valid yet at $BASE/$KEY.txt (deploy lag?)";;
            422)     echo "Warning: submission rejected as invalid/spam by IndexNow";;
            429)     echo "Warning: rate limited by IndexNow";;
            *)       echo "Warning: unexpected IndexNow response";;
          esac
